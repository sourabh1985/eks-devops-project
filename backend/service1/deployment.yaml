apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
      - name: backend
        image: 19710352****.dkr.ecr.ap-south-1.amazonaws.com/backend-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
