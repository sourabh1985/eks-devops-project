name: Deploy to EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag, Push Backend
      run: |
        docker build -t backend ./backend/service1
        docker tag backend:latest ${{ secrets.ECR_BACKEND }}
        docker push ${{ secrets.ECR_BACKEND }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ap-south-1 --name devops-eks

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/base/
